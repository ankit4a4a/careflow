<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#0c3b34">
  <title>CareFlow — Healthcare Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{fontFamily:{sans:['Figtree','system-ui','sans-serif'],display:['Bricolage Grotesque','Figtree','sans-serif']},colors:{forest:'#0C3B34',mint:'#0E8F78',canvas:'#EEF3F1',ink:'#12231F',muted:'#667A73',line:'#E1EAE6'}}}}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body class="bg-canvas text-ink font-sans">
  <div id="boot-splash" class="cf-splash" role="status" aria-live="polite">
    <div class="cf-splash-inner">
      <div class="cf-splash-mark"><i class="fa-solid fa-heart-pulse"></i></div>
      <div class="cf-splash-word">careflow</div>
      <svg class="cf-splash-ecg" viewBox="0 0 220 48" aria-hidden="true"><path pathLength="1000" d="M0,24 L50,24 Q58,14 66,24 L80,24 L86,28 L98,2 L110,46 L118,24 L140,24 Q155,6 170,24 L220,24"/></svg>
      <span class="sr-only">Loading CareFlow…</span>
    </div>
  </div>
  <div id="toast-root" class="fixed right-5 top-5 z-[100]"></div>
  
  <div id="app-shell" class="min-h-screen">
    <aside id="sidebar" class="sidebar"><div class="h-[72px] flex-none flex items-center px-6 gap-3 border-b border-white/10"><div class="w-9 h-9 rounded-xl flex items-center justify-center"><i class="fa-solid fa-heart-pulse"></i></div><span class="font-bold text-xl tracking-tight">careflow</span><button id="sidebar-close" class="ml-auto lg:hidden text-white/70"><i class="fa-solid fa-xmark"></i></button></div><div class="px-4 py-5"><div class="text-[10px] uppercase tracking-[.18em] text-white/40 font-bold px-3 mb-2">Workspace</div><nav id="side-nav" class="space-y-1"></nav></div><div class="mt-auto p-4"><div class="rounded-xl bg-white/5 p-4"><div class="text-xs text-white/50">Need a hand?</div><div class="text-sm font-semibold mt-1">CareFlow support</div><div class="text-xs text-white/50 mt-1">Ask your administrator for help.</div></div></div></aside>
    <div class="main-area"><header class="topbar"><button id="mobile-menu" class="lg:hidden icon-btn"><i class="fa-solid fa-bars"></i></button><div class="relative flex-1 max-w-xl"><i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-muted text-sm"></i><input id="global-search" class="search-input" placeholder="Search patients, doctors, invoices..."><kbd class="hidden sm:block absolute right-3 top-1/2 -translate-y-1/2">⌘ K</kbd></div><div class="flex items-center gap-2 sm:gap-4"><button id="quick-add" class="btn-primary hidden sm:inline-flex"><i class="fa-solid fa-plus"></i><span>Quick add</span></button><button class="icon-btn relative" id="notification-btn"><i class="fa-regular fa-bell"></i><span class="notification-dot"></span></button><div class="h-8 w-px bg-line"></div><button id="profile-btn" class="flex items-center gap-3"><div class="avatar" id="user-avatar">AD</div><div class="hidden md:block text-left"><div id="user-name" class="text-sm font-semibold">Admin</div><div id="user-role" class="text-xs text-muted">Administrator</div></div><i class="fa-solid fa-chevron-down text-[10px] text-muted"></i></button></div></header>
      <main id="page-content" class="p-5 sm:p-7 max-w-[1600px] mx-auto"></main>
    </div>
  </div>
  <div id="modal-root"></div><div id="mobile-overlay" class="mobile-overlay"></div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script><script src="./js/ui.js"></script><script src="./js/finance.js"></script><script src="./js/pharmacy.js"></script><script src="./js/diagnostics.js"></script><script src="./js/ipd.js"></script><script src="./js/hrm.js"></script><script src="./js/app.js"></script>
</body></html>
